name: CI

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Optional stable release tag to match against package.json
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    name: Test, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Test frontend and content
        run: node node_modules/vitest/vitest.mjs run --maxWorkers=1 --no-file-parallelism --testTimeout=20000
      - name: Typecheck and build production frontend
        run: npm run build
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Test backend without a live database
        run: python -m pytest -q backend/tests
      - name: Build and inspect release archives
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/package-release.mjs
      - name: Upload checked release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS
            artifacts/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
