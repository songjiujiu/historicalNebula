<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111917" />
    <script>
      try {
        const saved = localStorage.getItem('historical-nebula:theme:v1');
        const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f1e9' : '#111917';
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <meta name="description" content="从历史主线和白话导读读懂二十四史，点击事件直达原文段落。" />
    <title>历史星云 · 沿着史书读懂历史</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
