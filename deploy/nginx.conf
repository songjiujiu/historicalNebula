server {
    listen 80;
    listen [::]:80;
    server_name 82.157.197.102;
    root /srv/historical-nebula/current;
    index index.html;

    access_log /var/log/nginx/historical-nebula.access.log;
    error_log /var/log/nginx/historical-nebula.error.log;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~ /\. {
        deny all;
    }
}
